<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشاور هوشمند محصولات گانودرما دکتر بیز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background-color: #0f172a; color: #f1f5f9; display: flex; justify-content: center; min-height: 100vh; direction: rtl; text-align: right; }
    .app-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: #1e293b; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); position: relative; }
    .header { padding: 14px 16px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
    .header-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #10b981, #047857); display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .title-box h1 { font-size: 15px; font-weight: 700; color: #f8fafc; }
    .title-box p { font-size: 11px; color: #10b981; display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 7px; height: 7px; background: #10b981; border-radius: 50%; display: inline-block; }
    .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    .msg { max-width: 88%; padding: 12px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.7; word-wrap: break-word; }
    .msg-bot { align-self: flex-start; background: #334155; color: #f8fafc; border-bottom-right-radius: 4px; border: 1px solid #475569; }
    .msg-user { align-self: flex-end; background: linear-gradient(135deg, #059669, #10b981); color: #ffffff; border-bottom-left-radius: 4px; }
    .quick-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip-btn { background: #1e293b; border: 1px solid #10b981; color: #6ee7b7; padding: 7px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }
    .chip-btn:active { background: #10b981; color: #0f172a; }
    .product-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; margin-top: 8px; }
    .product-title { font-weight: 700; color: #34d399; font-size: 14px; margin-bottom: 6px; }
    .product-badge { display: inline-block; background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 2px 8px; border-radius: 6px; font-size: 11px; margin-bottom: 8px; border: 1px solid rgba(239, 68, 68, 0.4); }
    .action-links { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .btn-link { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: 600; text-align: center; background: #f97316; color: #fff; }
    .input-area { padding: 12px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; }
    .input-area input { flex: 1; background: #1e293b; border: 1px solid #475569; border-radius: 24px; padding: 10px 16px; color: #fff; font-size: 13px; outline: none; direction: rtl; }
    .send-btn { background: #10b981; border: none; width: 42px; height: 42px; border-radius: 50%; color: #fff; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <div class="header-info">
      <div class="avatar">☕</div>
      <div class="title-box">
        <h1>مشاور محصولات گانودرما دکتر بیز</h1>
        <p><span class="status-dot"></span> پاسخگوی آنلاین و خودکار</p>
      </div>
    </div>
  </div>
  <div class="chat-body" id="chat">
    <div class="msg msg-bot">
      سلام! به سامانه مشاوره تخصصی محصولات قارچ گانودرما دکتر بیز خوش آمدید. 🌱<br><br>
      برای راهنمایی دقیق، موضوع مد نظرتان را انتخاب کنید یا در کادر زیر بنویسید:
      <div class="quick-chips">
        <button class="chip-btn" onclick="sendQuick('کبد چرب')">🩺 کبد چرب</button>
        <button class="chip-btn" onclick="sendQuick('ریزش مو')">💇‍♂️ مو و پوست سر</button>
        <button class="chip-btn" onclick="sendQuick('لاغری')">⚖️ کاهش وزن و لاغری</button>
        <button class="chip-btn" onclick="sendQuick('سوپریم')">☕ قهوه سوپریم</button>
        <button class="chip-btn" onclick="sendQuick('موکا')">☕ قهوه موکا</button>
        <button class="chip-btn" onclick="sendQuick('قیمت و سفارش')">🛒 ثبت سفارش</button>
      </div>
    </div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="سوال خود را بپرسید (مثلا: فشار خون، موکا، لاته)..." onkeypress="if(event.key==='Enter') handleSend()">
    <button class="send-btn" onclick="handleSend()">➤</button>
  </div>
</div>
<script>
  const KNOWLEDGE_BASE = [
    {
      keywords: ['کبد', 'کبد چرب', 'سیروز', 'آنزیم'],
      title: 'پکیج بهبود کبد چرب گانودرما',
      text: 'قارچ گانودرما به دلیل داشتن آنتی‌اکسیدان‌های قوی و پلی‌ساکاریدها، سم‌زدایی کبد را تسریع کرده و آنزیم‌های کبدی (ALT و AST) را تنظیم می‌کند.<br><br><b>پیشنهاد اصلی:</b> قهوه موکا یا لاته گانودرما (مصرف روزانه یک ساشه ناشتا یا صبح‌ها).<br>⚠️ اگر همزمان فشار خون بالا ندارید، قهوه سوپریم نیز گزینه بسیار مؤثری است.',
      warning: null
    },
    {
      keywords: ['مو', 'ریزش', 'شوره', 'دوفاز', 'شامپو'],
      title: 'محصولات مراقبت موی گانودرما بیز',
      text: 'برای تقویت ریشه مو و بهبود گردش خون در پوست سر:<br>• <b>شامپو عصاره قارچ گانودرما</b> (مخصوص موهای خشک، چرب یا معمولی)<br>• <b>اسپری دوفاز مو گانودرما:</b> ترمیم‌کننده ساقه مو و جلوگیری از وز شدن و موخوره.<br>• <b>نرم‌کننده گانودرما:</b> آبرسانی عمقی بدون آسیب به ریشه.',
      warning: null
    },
    {
      keywords: ['سوپریم', 'جنسینگ', 'خرنوب', 'انرژی', 'اسپرم', 'جنسی', 'زگیل', 'hpv'],
      title: 'قهوه فوری سوپریم همراه با پودر قارچ گانودرما و جنسینگ',
      text: '<b>ترکیبات:</b> پودر قارچ گانودرما لوسیدوم، عصاره جینسینگ، پودر خرنوب و قهوه.<br><b>خواص:</b> افزایش شدید انرژی، تقویت قوای جنسی و باروری، بهبود پیسی و کمک به پاکسازی ویروس HPV.<br><b>طریقه مصرف:</b> روزانه یک ساشه در یک فنجان آب جوش حل کرده و صبح میل کنید.',
      warning: '⚠️ منع مصرف: برای افراد دارای فشار خون بالا و بانوان باردار یا شیرده توصیه نمی‌شود.'
    },
    {
      keywords: ['موکا', 'کاکائو', 'دیابت', 'پوست'],
      title: 'کافه موکا همراه با پودر قارچ گانودرما',
      text: '<b>ترکیبات:</b> پودر گانودرما، پودر قهوه و شکلات (کاکائو).<br><b>خواص:</b> ایجاد نشاط، بهبود تمرکز، روشن‌کننده و شاداب‌کننده پوست، کنترل قند خون.<br><b>مزیت مهم:</b> برای افرادی که تمایل به مصرف جینسینگ ندارند یا سابقه نوسان فشار خون دارند، گزینه‌ای بسیار ملایم و مطمئن است.',
      warning: null
    },
    {
      keywords: ['لاغری', 'کاهش وزن', 'چربی سوزی', 'اشتها'],
      title: 'پروتکل کاهش وزن با گانودرما',
      text: 'گانودرما متابولیسم و سوخت‌وساز پایه بدن را بالا می‌برد و با تثبیت قند خون از ریزه‌خواری جلوگیری می‌کند.<br><br><b>طریقه مصرف برای لاغری:</b><br>مصرف قهوه سوپریم یا موکا ۴۵ دقیقه قبل از وعده ناهار یا قبل از تمرین ورزشی جهت چربی‌سوزی حداکثری.',
      warning: null
    },
    {
      keywords: ['قیمت', 'خرید', 'سفارش', 'زنبیل', 'ایتا'],
      title: 'روش‌های ثبت سفارش و دریافت قیمت',
      text: 'تمامی محصولات اصل دکتر بیز با هولوگرام اصالت و جدیدترین تاریخ تولید ارائه می‌شوند.',
      warning: null
    }
  ];
  function addMessage(html, sender) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'msg ' + (sender === 'user' ? 'msg-user' : 'msg-bot');
    div.innerHTML = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }
  function sendQuick(text) {
    document.getElementById('userInput').value = text;
    handleSend();
  }
  function handleSend() {
    const input = document.getElementById('userInput');
    const query = input.value.trim();
    if (!query) return;
    addMessage(query, 'user');
    input.value = '';
    setTimeout(() => { findAnswer(query); }, 350);
  }
  function findAnswer(query) {
    const q = query.toLowerCase();
    let match = KNOWLEDGE_BASE.find(item => item.keywords.some(k => q.includes(k)));
    if (!match) {
      match = {
        title: 'مشاوره اختصاصی سفارش',
        text: 'برای بررسی دقیق‌تر شرایط بدنی، تداخل‌ها و انتخاب دقیق‌ترین محصول متناسب با شما، می‌توانید مستقیماً با ما در ارتباط باشید.',
        warning: null
      };
    }
    let cardHtml = `
      <div class="product-card">
        <div class="product-title">${match.title}</div>
        ${match.warning ? `<div class="product-badge">${match.warning}</div>` : ''}
        <div style="font-size:13px; line-height:1.7; color:#cbd5e1;">${match.text}</div>
        <div class="action-links">
          <a class="btn-link" href="https://eitaa.com/Ganoderma_mushroom" target="_blank">
            💬 سفارش و ارتباط در کانال ایتا (@Ganoderma_mushroom)
          </a>
        </div>
      </div>
    `;
    addMessage(cardHtml, 'bot');
  }
</script>
</body>
</html>
